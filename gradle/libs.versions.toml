# Versions resolved against the live repos on 2026-09-09 and against what this
# machine actually has installed. Do not "update" these from memory — see
# docs/LESSONS.md #8.
[versions]
agp = "9.4.0"                     # latest stable; requires Gradle 9.x
kotlin = "2.4.20"
coroutines = "1.11.0"
konsist = "0.17.3"

# Android SDK levels. compileSdk MUST be 37: android-37.0 is the only platform
# installed on this machine. Wear OS 7 == API 37, Wear OS 6 == 36, 5.1 == 35,
# 5 == 34, 4 == 33.
compileSdk = "37"
targetSdk = "36"                  # Wear OS 6 — the watch actually reports 36, verified by adb
minSdk = "33"                     # Wear OS 4 — oldest Galaxy Watch worth targeting

# --- Android / Wear libraries (used from phase 3 onward) ---
composeBom = "2026.09.00"
wearCompose = "1.6.2"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"
wearOngoing = "1.1.0"
wearToolingPreview = "1.0.0"
coreKtx = "1.19.0"

# Phone <-> watch sync (Wearable Data Layer). Resolved against Google Maven on 2026-09-10.
playServicesWearable = "20.0.1"
# Play services still depends on fragment 1.0.0, which breaks registerForActivityResult
# (lint: InvalidFragmentVersionForActivityResult). Pinned wherever Play services is used.
fragment = "1.9.0"

# JVM unit tests inside Android modules (AGP runs them on JUnit 4).
junit = "4.13.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
junit = { module = "junit:junit", version.ref = "junit" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
androidx-wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
androidx-wear-tooling-preview = { module = "androidx.wear:wear-tooling-preview", version.ref = "wearToolingPreview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
